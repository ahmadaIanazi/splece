name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npm ci
      - run: node scripts/check-repository.mjs
      - run: npm run build
      - run: npm test
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan Git history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all"'
      - name: Scan current tracked files and archives
        run: |
          mkdir "$RUNNER_TEMP/source-scan"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source-scan"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/source-scan" --redact=100 --no-banner --max-archive-depth=2
